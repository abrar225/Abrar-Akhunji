<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Abrar Akhunji — AI/ML and full-stack engineer in Ahmedabad">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B12"/>
      <stop offset="0.55" stop-color="#0A1320"/>
      <stop offset="1" stop-color="#071019"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79D0E0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#79D0E0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#79D0E0" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#79D0E0" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="halo" cx="0.78" cy="0.22" r="0.6">
      <stop offset="0" stop-color="#79D0E0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#79D0E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#halo)"/>

  <rect x="64" y="56" width="34" height="2" fill="#79D0E0"/>
  <text x="112" y="64" font-family="'SF Mono', 'Menlo', monospace" font-size="13" letter-spacing="4" fill="#8B9BB0">ABRAR AKHUNJI</text>

  <text x="64" y="228" font-family="'Avenir Next', 'Helvetica Neue', sans-serif" font-size="78" font-weight="500" letter-spacing="-3" fill="#E8EEF6">Engineer of</text>
  <text x="64" y="322" font-family="'Georgia', 'Times New Roman', serif" font-size="82" font-style="italic" letter-spacing="-2" fill="#A9E4EE">Intelligent</text>
  <text x="64" y="416" font-family="'Avenir Next', 'Helvetica Neue', sans-serif" font-size="78" font-weight="500" letter-spacing="-3" fill="#E8EEF6">Systems.</text>

  <rect x="64" y="474" width="620" height="1" fill="url(#glow)"/>

  <text x="64" y="524" font-family="'SF Mono', 'Menlo', monospace" font-size="13" letter-spacing="3" fill="#79D0E0">AI/ML · FULL-STACK · COMPUTER VISION</text>
  <text x="64" y="558" font-family="'SF Mono', 'Menlo', monospace" font-size="13" letter-spacing="3" fill="#5C6B80">AHMEDABAD · GANDHINAGAR · BANGALORE · REMOTE</text>

  <g transform="translate(1010 486)">
    <circle cx="0" cy="0" r="3.5" fill="#79D0E0"/>
    <text x="16" y="5" font-family="'SF Mono', 'Menlo', monospace" font-size="12" letter-spacing="2" fill="#8B9BB0">OPEN TO WORK</text>
  </g>

  <text x="1136" y="64" text-anchor="end" font-family="'SF Mono', 'Menlo', monospace" font-size="12" letter-spacing="2" fill="#5C6B80">ABRARAKHUNJI.COM</text>
</svg>
