<!doctype html><meta charset="utf-8"><title>Build Room Asset Studio</title><style>body{margin:0;background:#eef1ed}canvas{display:block}#output{position:absolute;top:10px;left:10px;font:12px system-ui} @font-face{font-family:'Instrument Sans';src:url('/assets/build-room/fonts/body-regular.woff2')}</style><div id="output">Rendering production assets</div><script type="module">
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { createBuildRoom, CAMERA_POSES } from '/src/lib/build-room/sceneFactory.js';
await document.fonts.ready;
const renderer = new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
const room=createBuildRoom(renderer);await room.ready;
const compactRoom=createBuildRoom(renderer,{mobile:true});await compactRoom.ready;
window.renderAsset=async(theme='light',mobile=false,kind='room',selectedIndex=0)=>{
 const compact=mobile&&kind!=='hero';const r=compact?compactRoom:room;
 const width=mobile?(kind==='hero'?1200:800):1600,height=mobile&&kind==='hero'?800:1000;renderer.setSize(width,height);r.setTheme(theme);r.scene.background=null;r.floor.visible=false;
 r.trays.forEach((t,i)=>{t.visible=kind!=='contact'&&(!compact||i===selectedIndex);t.position.set(compact?0:(i-1)*3.1,.35,0);});r.empty.visible=kind==='contact';r.layerGroups.forEach((g,i)=>g.visible=kind==='cutaway'&&i===1);r.screenPivots.forEach((p,i)=>p.position.y=.18+(kind==='cutaway'&&i===1?.9:0));
 const camera=new THREE.PerspectiveCamera(38,width/height,.1,100);const pose=CAMERA_POSES[kind==='contact'?'contact':kind==='cutaway'?'inspect':kind==='hero'&&!mobile?'hero':'work'];camera.position.set(...(compact?[0,3.5,8.2]:pose.position));camera.lookAt(...pose.target);renderer.render(r.scene,camera);
 return {image:renderer.domElement.toDataURL('image/png').split(',')[1],triangles:renderer.info.render.triangles,drawCalls:renderer.info.render.calls};
};
window.exportModel=async()=>{
 room.trays.forEach((tray,i)=>{tray.visible=true;tray.position.set((i-1)*3.1,.35,0);});room.layerGroups.forEach(group=>group.visible=false);room.screenPivots.forEach(pivot=>pivot.position.y=.18);room.empty.visible=false;room.shelf.visible=false;
 const copy=room.model.clone(true);copy.getObjectByName('ContactShadow')?.removeFromParent();
 const buffer=await new GLTFExporter().parseAsync(copy,{binary:true,onlyVisible:true});const bytes=new Uint8Array(buffer);let s='';for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s);
};
window.assetReady=true;
</script>
